name: secret-scan

# Secret guard. Runs on every PR and on main: gitleaks (pinned release, checksum-verified) over the checked-out tree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: re-check when the PR title or body changes
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# A newer event on the same PR cancels the older in-progress scan.
# Each commit on main gets its own group,
# so main runs are never cancelled or queued behind each other.
concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    # A hung scan used to sit in_progress for 20+ minutes (security audit 2026-10-18, I5).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the commit-message guard can walk base..head.
          fetch-depth: 0
      - name: gitleaks (tree)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --exit-code 1
