name: secret-scan

# Identity and secret guard. Runs on every PR and on main.
#  1. gitleaks (pinned release, checksum-verified) over the checked-out tree, with .gitleaks.toml.
#  2. scripts/check-never-reveal.ts: fails on any word from the private never-reveal list. The list is not in the repo:
#     it comes from the NEVER_REVEAL_KEY and NEVER_REVEAL_DIGESTS Actions secrets (HMAC key + keyed digests).
#     Push to main: required (fails if the secrets are missing). Same-repo PRs: enforced when the secrets exist.
#     Fork PRs get no secrets, so the step skips with a notice. Never runs on pull_request_target.
#  3. scripts/check-never-reveal-commits.ts: the same list over the NEW commit messages (base..head, merges included),
#     the PR title and body, and the branch name. The script reads those from the event JSON ($GITHUB_EVENT_PATH)
#     itself, so they never appear as step env (which the log prints) or inline in the shell.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: re-check when the PR title or body changes
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Minutes trim (2026-10-19): a newer event on the same PR cancels the older in-progress scan. Every
# run is still a full scan (tree + never-reveal + messages). Each commit on main gets its own group,
# so main runs are never cancelled or queued behind each other.
concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    # A hung scan used to sit in_progress for 20+ minutes (security audit 2026-10-18, I5).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history so the commit-message guard can walk base..head.
          fetch-depth: 0
      - name: gitleaks (tree)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --exit-code 1
